<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Gallery - Rodmina Ibe</title>
    <link rel="stylesheet" href="css/rwd.css">
</head>
<body>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
        <img id="sun-icon" src="https://cdn-icons-png.flaticon.com/128/3917/3917817.png" alt="Sun">
        <img id="moon-icon" src="https://static.vecteezy.com/system/resources/previews/017/177/956/large_2x/flat-moon-icon-on-transparent-background-free-png.png" alt="Crescent Moon" style="display: none;">
    </button>

    <div class="page-container">
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <div class="content-section">
            <h1>Picture Gallery</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="images/18th-birthday-photoshoot.jpg" alt="Gallery Image 1">
                    <p>18th Birthday Photoshoot</p>
                </div>

                <div class="gallery-item">
                    <img src="images/picture-taken-by-goodcamera.jpg" alt="Gallery Image 2">
                    <p>This Photo was taken by Taiwanese Photographer</p>
                </div>

                <div class="gallery-item">
                    <img src="images/jpcs-photoshoot.jpg" alt="Gallery Image 3">
                    <p>JPCS Photoshoot</p>
                </div>

                <div class="gallery-item">
                    <img src="images/placeholder.jpg" alt="Gallery Image 4">
                    <p>Image Caption 4</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme-toggle.js"></script>
</body>
</html>
